<link rel="stylesheet" href="/_pasiya/palette.css"><script>try{var d=document.documentElement,t=localStorage.getItem("pasiya_theme");d.dataset.accent="blue";d.dataset.theme=t==="light"?"light":"dark";d.style.colorScheme=d.dataset.theme}catch(e){document.documentElement.dataset.theme="dark";document.documentElement.dataset.accent="blue"}</script><link rel="stylesheet" href="/_pasiya/shell.css"><script>window.PS_ROLE="ai"</script><script src="/_pasiya/shell.js" defer></script>

<body>
    <div class="ps-loader ps-auto" id="ps-loader"><div class="ps-orb"><i></i><i></i><i></i><b>P</b></div><div class="ps-brand">PASIYA OFC</div><div class="ps-sub">Opening PASIYA AI</div><div class="ps-bar"><span></span></div></div>
    <script>(function(){var l=document.getElementById('ps-loader'),t=Date.now(),d=0;function h(){if(d||!l)return;d=1;var w=Math.max(0,350-(Date.now()-t));setTimeout(function(){l.classList.add('ps-hide');setTimeout(function(){l.remove()},700)},w)}if(document.readyState==='complete')h();else addEventListener('load',h);setTimeout(h,4000)})();</script>

    <div class="layout" id="layout">
        <!-- chat history (ChatGPT style) -->
        <aside class="side" id="side" aria-label="Chat history">
            <div class="side-top">
                <button type="button" class="newchat" id="newChat"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>New chat</span></button>
                <button type="button" class="ibtn side-x" id="sideClose" aria-label="Close chat history"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
            </div>
            <label class="side-search"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input type="search" id="convSearch" placeholder="Search chats" autocomplete="off" aria-label="Search chats"></label>
            <div class="convs" id="convs"></div>
            <div class="side-foot" id="sideFoot"></div>
        </aside>
        <div class="side-back" id="sideBack"></div>

    <div class="app">
        <div class="topline">
            <button type="button" class="ibtn" id="sideBtn" aria-label="Chat history" aria-expanded="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 4v16" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
            <div class="top-sp"></div>
            <button type="button" class="ibtn" id="clear" aria-label="New chat" title="New chat"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>

        <!-- CHAT & CODE -->
        <section class="view active" id="view-chat">
            <main class="chat" id="chat" aria-live="polite">
                <div class="welcome" id="welcome">
                    <div class="orb"><b>P</b></div>
                    <h1>PASIYA AI</h1>
                    <p>Chat, write code in any language, build whole projects and download them as a ZIP.</p>
                    <div class="chips" id="chips">
                        <button type="button">Oyawa hadapu kauda?</button>
                        <button type="button">Build a todo app with HTML, CSS and JS</button>
                        <button type="button">Python Telegram bot ekak hadala denna</button>
                        <button type="button">Explain what an API is</button>
                    </div>
                </div>
            </main>

            <div class="projbar" id="projbar">
                <span class="pinfo" id="pinfo">No project yet. Ask me to build one, or import yours to fix bugs.</span>
                <button type="button" id="pFiles" hidden>Files</button>
                <button type="button" id="pZip" hidden>Download ZIP</button>
                <button type="button" id="pImport">Import</button>
                <button type="button" id="pClear" hidden>Clear</button>
                <input type="file" id="pFile" multiple hidden>
            </div>

            <form class="composer" id="form" autocomplete="off">
                <textarea id="input" rows="1" maxlength="20000" placeholder="Message PASIYA AI..." aria-label="Message"></textarea>
                <button type="submit" id="send" aria-label="Send"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M3.4 20.4 21 12 3.4 3.6l-.01 6.5L15 12 3.39 13.9z" fill="currentColor"/></svg></button>
            </form>
            <p class="fine">PASIYA AI can make mistakes. Check important information.</p>
        </section>
    </div>
    </div>

    <!-- project files dialog -->
    <div class="dlg" id="dlg" hidden>
        <div class="dlg-box">
            <div class="dlg-head"><strong id="dlgTitle">Project files</strong><div><button type="button" id="dlgCopy">Copy</button><button type="button" id="dlgClose">Close</button></div></div>
            <div class="dlg-body"><ul id="dlgList"></ul><textarea id="dlgCode" spellcheck="false"></textarea></div>
        </div>
    </div>
    <script src="/ai/zip.js"></script>
    <script src="/ai/ai.js"></script>
